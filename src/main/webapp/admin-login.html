<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Sign In | HASHbid Control</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/hashbid-logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <!-- Top Navigation -->
    <header>
        <nav class="navbar bs-navbar">
            <a href="index.html" class="logo bs-logo">
                <img src="assets/images/hashbid-logo.svg" alt="HASHbid Emblem" width="24" height="24" style="border-radius: 6px;">
                HASH<span>bid</span>
                <span class="logo-badge" style="background: var(--bs-color-danger-soft); color: var(--bs-color-danger); border-color: rgba(200, 121, 121, 0.4);">Ops</span>
            </a>

            <a href="auth.html" class="back-home bs-back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                Choose Role
            </a>
        </nav>
    </header>

    <main class="form-page-container bs-page-container">
        <div class="bs-auth-card-wrap">
            <section class="form-intro bs-page-header" style="text-align: center; margin-bottom: 24px;">
                <span class="bs-eyebrow auth-tag" style="background: var(--bs-color-danger-soft); color: var(--bs-color-danger); border-color: rgba(200, 121, 121, 0.35);">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
                    </svg>
                    OPERATIONS SECURITY
                </span>
                <h1>Administrator Sign In</h1>
                <p style="margin: 0 auto; font-size: 14px;">Authorized system operators only. Provide credentials to access the central moderation console.</p>
            </section>

            <!-- Dynamic URL Feedback Banner -->
            <div id="authAlert" style="display: none; margin-bottom: 20px;"></div>

            <section class="registration-form-card bs-card">
                <form action="login" method="post" id="adminLoginForm">
                    <div style="display: flex; flex-direction: column; gap: 18px;">
                        <div class="form-group bs-field">
                            <label for="email" class="bs-field__label">Admin Email Address</label>
                            <input type="email" id="email" name="email" class="bs-field__control" placeholder="admin@hashbid.com" required autocomplete="email">
                        </div>

                        <div class="form-group bs-field">
                            <label for="password" class="bs-field__label">Master Password</label>
                            <input type="password" id="password" name="password" class="bs-field__control" placeholder="Enter admin password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="bs-button bs-button--primary form-submit-button" id="adminSubmitBtn" style="width: 100%; margin-top: 6px;">
                            <span class="bs-spinner" aria-hidden="true"></span>
                            <span>Authenticate Operator</span>
                        </button>
                    </div>

                    <div style="margin-top: 24px; padding: 12px; background: var(--bs-color-ink-canvas); border: 1px solid var(--bs-color-border-subtle); border-radius: var(--bs-radius-sm); text-align: center;">
                        <p class="form-note" style="margin: 0; font-size: 12px; color: var(--bs-color-muted);">
                            🔒 Restricted Access. All administrative login attempts and session actions are recorded in the audit trail.
                        </p>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        (function checkAuthParams() {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('authAlert');
            if (params.get('error') === 'invalid' && alertBox) {
                alertBox.className = 'bs-alert bs-alert--error';
                alertBox.textContent = 'Invalid administrator credentials. Access denied.';
                alertBox.style.display = 'flex';
            }
        })();

        document.getElementById('adminLoginForm')?.addEventListener('submit', function() {
            const btn = document.getElementById('adminSubmitBtn');
            if (btn) {
                btn.classList.add('is-loading');
                btn.disabled = true;
            }
        });
    </script>
</body>
</html>
