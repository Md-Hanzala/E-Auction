<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | HASHbid Marketplace</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/hashbid-logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <!-- Top Navigation -->
    <header>
        <nav class="navbar bs-navbar">
            <a href="index.html" class="logo bs-logo">
                <img src="assets/images/hashbid-logo.svg" alt="HASHbid Emblem" width="24" height="24" style="border-radius: 6px;">
                HASH<span>bid</span>
            </a>

            <a href="auth.html" class="back-home bs-back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                Choose Role
            </a>
        </nav>
    </header>

    <main class="form-page-container bs-page-container">
        <div class="bs-auth-card-wrap">
            <section class="form-intro bs-page-header" style="text-align: center; margin-bottom: 24px;">
                <span class="bs-eyebrow auth-tag">ACCOUNT ACCESS</span>
                <h1>Sign In to HASHbid</h1>
                <p style="margin: 0 auto; font-size: 14px;">Enter your credentials to access your dashboard, monitor lots, or manage listings.</p>
            </section>

            <!-- Dynamic URL Feedback Banner -->
            <div id="authAlert" style="display: none; margin-bottom: 20px;"></div>

            <section class="registration-form-card bs-card">
                <form action="login" method="post" id="loginForm">
                    <div style="display: flex; flex-direction: column; gap: 18px;">
                        <div class="form-group bs-field">
                            <label for="email" class="bs-field__label">Email Address</label>
                            <input type="email" id="email" name="email" class="bs-field__control" placeholder="name@domain.com" required autocomplete="email">
                        </div>

                        <div class="form-group bs-field">
                            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                                <label for="password" class="bs-field__label">Password</label>
                            </div>
                            <input type="password" id="password" name="password" class="bs-field__control" placeholder="Enter your password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="bs-button bs-button--primary form-submit-button" id="loginSubmitBtn" style="width: 100%; margin-top: 6px;">
                            <span class="bs-spinner" aria-hidden="true"></span>
                            <span>Sign In</span>
                        </button>
                    </div>

                    <p class="form-note" style="text-align: center; margin-top: 24px; font-size: 13px;">
                        Don't have an account? <br>
                        <a href="buyer-register.html">Create Buyer Account</a> · <a href="seller-register.html">Apply as Seller</a>
                    </p>
                </form>
            </section>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        // Check for URL parameters (?error=invalid or ?registered=true)
        (function checkAuthParams() {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('authAlert');
            if (!alertBox) return;

            if (params.get('error') === 'invalid') {
                alertBox.className = 'bs-alert bs-alert--error';
                alertBox.textContent = 'Invalid email or password. Please verify your credentials and try again.';
                alertBox.style.display = 'flex';
            } else if (params.get('registered') === 'true') {
                alertBox.className = 'bs-alert bs-alert--success';
                alertBox.textContent = 'Account created successfully! Please sign in with your credentials.';
                alertBox.style.display = 'flex';
            }
        })();

        // Loading state on form submit
        document.getElementById('loginForm')?.addEventListener('submit', function() {
            const btn = document.getElementById('loginSubmitBtn');
            if (btn) {
                btn.classList.add('is-loading');
                btn.disabled = true;
            }
        });
    </script>
</body>
</html>
