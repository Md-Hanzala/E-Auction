<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Live Auction - E-Auction</title>
</head>

<body>

    <h1>Live Auction</h1>

    <p id="auctionLoading">
        Loading auction...
    </p>

    <div id="auctionContent" style="display:none;">

        <div>
            <img id="productImage"
                 src=""
                 alt="Product Image"
                 width="400">
        </div>

        <h2 id="productName"></h2>

        <p id="productDescription"></p>

        <p>
            <strong>Starting Price:</strong>
            ₹<span id="startPrice"></span>
        </p>

        <p>
            <strong>Current Price:</strong>
            ₹<span id="currentPrice"></span>
        </p>

        <p>
            <strong>Time Remaining:</strong>
            <span id="countdown">Calculating...</span>
        </p>

        <p>
            <strong>Start Time:</strong>
            <span id="startTime"></span>
        </p>

        <p>
            <strong>End Time:</strong>
            <span id="endTime"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="auctionStatus"></span>
        </p>


        <div id="biddingSection">

            <h2>Place Bid</h2>

            <p>
                <input type="number"
                       id="bidAmount"
                       step="0.01"
                       min="0"
                       placeholder="Enter bid amount">
            </p>

            <p>
                <button type="button"
                        id="placeBidButton"
                        onclick="placeBid()">
                    PLACE BID
                </button>

                <button type="button"
                        onclick="resetBid()">
                    RESET
                </button>
            </p>


            <h2>Quick Bid</h2>

            <div id="quickBids">

                <button type="button"
                        id="quickBid2"
                        onclick="placeQuickBid(2)">
                    ₹0
                </button>

                <button type="button"
                        id="quickBid5"
                        onclick="placeQuickBid(5)">
                    ₹0
                </button>

                <button type="button"
                        id="quickBid10"
                        onclick="placeQuickBid(10)">
                    ₹0
                </button>

                <button type="button"
                        id="quickBid20"
                        onclick="placeQuickBid(20)">
                    ₹0
                </button>

            </div>

        </div>


        <h3>Latest Update</h3>

        <p id="latestUpdate">
            Waiting for auction updates...
        </p>

    </div>


    <p>
        <a href="index.html">
            Back to Dashboard
        </a>
    </p>


    <script>

        let currentPrice = 0;

        let auctionId = null;

        let socket = null;

        let auctionEndTime = null;

        let auctionStatus = null;

        let countdownInterval = null;

        let pendingBidKey = null;

        let pendingBidAmount = null;


        function getAuctionIdFromUrl() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("auction_id");

        }


        function getImageUrl(imageReference) {

            if (!imageReference) {

                return "";

            }


            if (
                imageReference.startsWith("http://") ||
                imageReference.startsWith("https://")
            ) {

                return imageReference;

            }


            if (
                imageReference.startsWith("image/")
            ) {

                imageReference =
                    "/uploads/" +
                    imageReference.substring(
                        "image/".length
                    );

            }


            if (
                imageReference.startsWith("/")
            ) {

                const contextPath =
                    window.location.pathname.substring(
                        0,
                        window.location.pathname.lastIndexOf("/")
                    );

                return contextPath + imageReference;

            }


            return imageReference;

        }


        function loadAuctionDetails() {

            auctionId =
                getAuctionIdFromUrl();


            if (!auctionId) {

                document.getElementById(
                    "auctionLoading"
                ).innerText =
                    "Auction not specified.";

                return;

            }


            fetch(
                "auction-details?auction_id="
                + encodeURIComponent(
                    auctionId
                )
            )

            .then(response =>
                response.json()
            )

            .then(data => {

                if (data.error) {

                    document.getElementById(
                        "auctionLoading"
                    ).innerText =
                        data.error;

                    return;

                }


                currentPrice =
                    parseFloat(
                        data.current_price
                    );


                auctionEndTime =
                    data.end_time;


                auctionStatus =
                    data.status;


                document.getElementById(
                    "productName"
                ).innerText =
                    data.name;


                document.getElementById(
                    "productDescription"
                ).innerText =
                    data.description;


                document.getElementById(
                    "startPrice"
                ).innerText =
                    Number(
                        data.start_price
                    ).toLocaleString(
                        "en-IN"
                    );


                document.getElementById(
                    "currentPrice"
                ).innerText =
                    Number(
                        currentPrice
                    ).toLocaleString(
                        "en-IN"
                    );


                document.getElementById(
                    "startTime"
                ).innerText =
                    formatDate(
                        data.start_time
                    );


                document.getElementById(
                    "endTime"
                ).innerText =
                    formatDate(
                        data.end_time
                    );


                document.getElementById(
                    "auctionStatus"
                ).innerText =
                    data.status;


                if (data.image_reference) {

                    document.getElementById(
                        "productImage"
                    ).src =
                        getImageUrl(
                            data.image_reference
                        );

                }


                updateBiddingSection();


                document.getElementById(
                    "auctionLoading"
                ).style.display =
                    "none";


                document.getElementById(
                    "auctionContent"
                ).style.display =
                    "block";


                if (auctionStatus === "LIVE") {

                    updateQuickBids();

                }


                startCountdown(
                    auctionEndTime
                );

            })

            .catch(error => {

                console.error(
                    "Auction loading error:",
                    error
                );

                document.getElementById(
                    "auctionLoading"
                ).innerText =
                    "Unable to load auction.";

            });

        }


        function updateBiddingSection() {

            const biddingSection =
                document.getElementById(
                    "biddingSection"
                );


            if (auctionStatus === "LIVE") {

                biddingSection.style.display =
                    "block";

            } else {

                biddingSection.style.display =
                    "none";

            }

        }


        function calculateQuickBid(percent) {

            return Number(
                (
                    currentPrice *
                    (1 + percent / 100)
                ).toFixed(2)
            );

        }


        function updateQuickBids() {

            if (
                currentPrice <= 0 ||
                auctionStatus !== "LIVE"
            ) {

                return;

            }


            document.getElementById(
                "quickBid2"
            ).innerText =
                "₹"
                + calculateQuickBid(
                    2
                ).toLocaleString(
                    "en-IN"
                );


            document.getElementById(
                "quickBid5"
            ).innerText =
                "₹"
                + calculateQuickBid(
                    5
                ).toLocaleString(
                    "en-IN"
                );


            document.getElementById(
                "quickBid10"
            ).innerText =
                "₹"
                + calculateQuickBid(
                    10
                ).toLocaleString(
                    "en-IN"
                );


            document.getElementById(
                "quickBid20"
            ).innerText =
                "₹"
                + calculateQuickBid(
                    20
                ).toLocaleString(
                    "en-IN"
                );

        }


        function placeQuickBid(percent) {

            if (
                auctionStatus !== "LIVE"
            ) {

                return;

            }


            if (currentPrice <= 0) {

                showMessage(
                    "Current price is not available."
                );

                return;

            }


            const amount =
                calculateQuickBid(
                    percent
                );


            document.getElementById(
                "bidAmount"
            ).value =
                amount;

        }


        function resetBid() {

            document.getElementById(
                "bidAmount"
            ).value = "";

        }


        function placeBid() {

            if (
                auctionStatus !== "LIVE"
            ) {

                showMessage(
                    "This auction is not live."
                );

                return;

            }


            const amount =
                document.getElementById(
                    "bidAmount"
                ).value;


            if (!auctionId) {

                showMessage(
                    "Auction not specified."
                );

                return;

            }


            if (!amount) {

                showMessage(
                    "Enter a bid amount."
                );

                return;

            }


            const placeBidButton =
                document.getElementById(
                    "placeBidButton"
                );


            placeBidButton.disabled =
                true;


            if (pendingBidKey !== null &&
                    pendingBidAmount === amount) {
                // Retry of the same failed attempt:
                // reuse the existing idempotency key.
            } else {
                pendingBidKey =
                        crypto.randomUUID();
                pendingBidAmount = amount;
            }


            const idempotencyKey = pendingBidKey;


            const formData =
                new URLSearchParams();


            formData.append(
                "auction_id",
                auctionId
            );


            formData.append(
                "amount",
                amount
            );


            formData.append(
                "idempotency_key",
                idempotencyKey
            );


            fetch(
                "placeBid",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        formData.toString()
                }
            )

            .then(response =>
                response.text()
            )

            .then(data => {

                if (data.indexOf("Bid Accepted") !== -1) {

                    pendingBidKey = null;
                    pendingBidAmount = null;
                }

                showMessage(
                    extractServerMessage(
                        data
                    )
                );


                loadAuctionDetails();

            })

            .catch(error => {

                showMessage(
                    "Bid request failed."
                );

                console.error(
                    "Bid error:",
                    error
                );

            })

            .finally(() => {

                placeBidButton.disabled =
                    false;

            });

        }


        function extractServerMessage(html) {

            const parser =
                new DOMParser();

            const documentObject =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            const heading =
                documentObject.querySelector(
                    "h1"
                );


            const paragraph =
                documentObject.querySelector(
                    "p"
                );


            if (
                heading &&
                paragraph
            ) {

                return (
                    heading.innerText
                    + ": "
                    + paragraph.innerText
                );

            }


            return "Bid request completed.";

        }


        function showMessage(message) {

            document.getElementById(
                "latestUpdate"
            ).innerText =
                message;

        }


        function startCountdown(endTime) {

            function update() {

                const now =
                    new Date();

                const end =
                    new Date(
                        endTime.replace(
                            " ",
                            "T"
                        )
                    );


                const difference =
                    end.getTime()
                    - now.getTime();


                const countdown =
                    document.getElementById(
                        "countdown"
                    );


                if (difference <= 0) {

                    countdown.innerText =
                        "Auction ended";

                    return;

                }


                countdown.innerText =
                    "⏱ "
                    + formatDuration(
                        difference
                    );

            }


            update();


            if (countdownInterval !== null) {

                clearInterval(countdownInterval);
            }

            countdownInterval =
                setInterval(
                    update,
                    1000
                );

        }


        function formatDuration(
            milliseconds
        ) {

            let seconds =
                Math.floor(
                    milliseconds / 1000
                );


            const days =
                Math.floor(
                    seconds / 86400
                );

            seconds %= 86400;


            const hours =
                Math.floor(
                    seconds / 3600
                );

            seconds %= 3600;


            const minutes =
                Math.floor(
                    seconds / 60
                );

            seconds %= 60;


            return (
                (days > 0
                    ? days + "d "
                    : "")
                + String(hours)
                    .padStart(2, "0")
                + ":"
                + String(minutes)
                    .padStart(2, "0")
                + ":"
                + String(seconds)
                    .padStart(2, "0")
            );

        }


        function connectWebSocket() {

            const protocol =
                window.location.protocol ===
                "https:"
                ? "wss:"
                : "ws:";


            const socketUrl =
                protocol
                + "//"
                + window.location.host
                + window.location.pathname
                    .substring(
                        0,
                        window.location.pathname
                            .lastIndexOf("/")
                    )
                + "/auctionSocket";


            socket =
                new WebSocket(
                    socketUrl
                );


            socket.onopen =
                function() {

                    console.log(
                        "WebSocket connected."
                    );

                };


            socket.onmessage =
                function(event) {

                    try {

                        const data =
                            JSON.parse(
                                event.data
                            );


                        if (
                            parseInt(
                                data.auction_id
                            ) !==
                            parseInt(
                                auctionId
                            )
                        ) {

                            return;

                        }


                        if (
                            data.type ===
                            "BID_UPDATE"
                        ) {

                            currentPrice =
                                parseFloat(
                                    data.current_price
                                );


                            if (data.end_time) {

                                auctionEndTime =
                                    data.end_time;

                            }


                            document.getElementById(
                                "currentPrice"
                            ).innerText =
                                Number(
                                    currentPrice
                                ).toLocaleString(
                                    "en-IN"
                                );


                            updateQuickBids();


                            document.getElementById(
                                "latestUpdate"
                            ).innerText =
                                "New bid: ₹"
                                + Number(
                                    currentPrice
                                ).toLocaleString(
                                    "en-IN"
                                );


                            if (data.extended) {

                                document.getElementById(
                                    "latestUpdate"
                                ).innerText +=
                                    " | Auction extended by "
                                    + data.extension_seconds
                                    + " seconds.";

                            }

                        } else if (
                            data.type ===
                            "LIFECYCLE"
                        ) {

                            loadAuctionDetails();

                            return;

                        }

                    } catch (error) {

                        console.error(
                            "WebSocket message error:",
                            error
                        );

                    }

                };


            socket.onclose =
                function() {

                    console.log(
                        "WebSocket disconnected."
                    );

                };


            socket.onerror =
                function(error) {

                    console.error(
                        "WebSocket error:",
                        error
                    );

                };

        }


        function formatDate(dateString) {

            const date =
                new Date(
                    dateString.replace(
                        " ",
                        "T"
                    )
                );


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return dateString;

            }


            return date.toLocaleString(
                "en-IN",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        loadAuctionDetails();

        connectWebSocket();

    </script>

</body>

</html>
