<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>E-Auction Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        #userSection {
            text-align: right;
        }

        #logoutLink {
            color: white;
            text-decoration: none;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            color: #333;
        }

        main {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        section {
            margin-bottom: 50px;
            scroll-margin-top: 20px;
        }

        section h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .auction-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .auction-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .auction-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .auction-content {
            padding: 20px;
        }

        .auction-content h3 {
            margin-top: 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        .time {
            margin: 8px 0;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .status {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .view-button {
            display: inline-block;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-button:hover {
            background: #444;
        }

        .empty {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #222;
            color: white;
        }

        footer a {
            color: white;
        }

    </style>

</head>

<body>

<header>

    <h1>E-Auction Dashboard</h1>

    <div id="userSection">
        Loading...
    </div>

</header>


<nav>

    <a href="#live">
        Live Bidding
    </a>

    <a href="#upcoming">
        Upcoming Bidding
    </a>

    <a href="#sold">
        Sold Bidding
    </a>

</nav>


<main>

    <section id="live">

        <h2>
            🔴 Live Bidding
        </h2>

        <div
            id="liveAuctions"
            class="auction-grid">

            Loading live auctions...

        </div>

    </section>


    <section id="upcoming">

        <h2>
            🔵 Upcoming Bidding
        </h2>

        <div
            id="upcomingAuctions"
            class="auction-grid">

            Loading upcoming auctions...

        </div>

    </section>


    <section id="sold">

        <h2>
            🟢 Sold Bidding
        </h2>

        <div
            id="soldAuctions"
            class="auction-grid">

            Loading sold auctions...

        </div>

    </section>

</main>


<footer>

    <a href="logout">
        Logout
    </a>

</footer>


<script>

    let auctions = [];


    function loadUserSession() {

        fetch("user-session")

            .then(response => response.json())

            .then(data => {

                const userSection =
                    document.getElementById(
                        "userSection"
                    );

                if (data.loggedIn) {

                    userSection.innerHTML =
                        "<strong>Hi "
                        + data.userName
                        + "</strong>";

                } else {

                    window.location.href =
                        "login.html";

                }

            })

            .catch(error => {

                console.error(
                    "Session error:",
                    error
                );

            });

    }


    function loadAuctions() {

        fetch("auction-list")

            .then(response => response.json())

            .then(data => {

                if (!Array.isArray(data)) {

                    console.error(
                        "Invalid auction data:",
                        data
                    );

                    return;
                }

                auctions = data;

                displayAuctions();

            })

            .catch(error => {

                console.error(
                    "Auction loading error:",
                    error
                );

            });

    }


    function createAuctionCard(auction) {

        const card =
            document.createElement("div");

        card.className =
            "auction-card";


        const image =
            document.createElement("img");


        if (auction.imageReference) {

            image.src =
                auction.imageReference;

            image.alt =
                auction.name;

        } else {

            image.alt =
                "No image available";

        }


        image.onerror = function () {

            this.style.display = "none";

        };


        const content =
            document.createElement("div");

        content.className =
            "auction-content";


        const title =
            document.createElement("h3");

        title.textContent =
            auction.name;


        const startingPrice =
            document.createElement("div");

        startingPrice.className =
            "price";

        startingPrice.textContent =
            "Starting Price: ₹"
            + Number(
                auction.startPrice
            ).toLocaleString("en-IN");


        const currentPrice =
            document.createElement("div");

        currentPrice.className =
            "price";


        if (auction.status === "SOLD") {

            currentPrice.textContent =
                "Final Price: ₹"
                + Number(
                    auction.currentPrice
                ).toLocaleString("en-IN");

        } else {

            currentPrice.textContent =
                "Current Price: ₹"
                + Number(
                    auction.currentPrice
                ).toLocaleString("en-IN");

        }


        const startTime =
            document.createElement("div");

        startTime.className =
            "time";

        startTime.textContent =
            "Starts: "
            + formatDate(
                auction.startTime
            );


        const endTime =
            document.createElement("div");

        endTime.className =
            "time";

        endTime.textContent =
            "Ends: "
            + formatDate(
                auction.endTime
            );


        const timer =
            document.createElement("div");

        timer.className =
            "timer";


        if (auction.status === "LIVE") {

            content.appendChild(timer);

            startCountdown(
                timer,
                auction.endTime
            );

        }


        if (auction.status === "SCHEDULED") {

            content.appendChild(timer);

            startUpcomingCountdown(
                timer,
                auction.startTime
            );

        }


        const status =
            document.createElement("div");

        status.className =
            "status";

        status.textContent =
            "Status: "
            + auction.status;


        const button =
            document.createElement("a");

        button.className =
            "view-button";

        button.href =
            "auction-details?auction_id="
            + encodeURIComponent(
                auction.auctionId
            );

        button.textContent =
            "VIEW PRODUCT";


        content.appendChild(title);

        content.appendChild(startingPrice);

        content.appendChild(currentPrice);

        content.appendChild(startTime);

        content.appendChild(endTime);

        content.appendChild(status);

        content.appendChild(button);


        card.appendChild(image);

        card.appendChild(content);


        return card;

    }


    function displayAuctions() {

        const live =
            document.getElementById(
                "liveAuctions"
            );

        const upcoming =
            document.getElementById(
                "upcomingAuctions"
            );

        const sold =
            document.getElementById(
                "soldAuctions"
            );


        live.innerHTML = "";

        upcoming.innerHTML = "";

        sold.innerHTML = "";


        let liveCount = 0;

        let upcomingCount = 0;

        let soldCount = 0;


        auctions.forEach(auction => {

            const card =
                createAuctionCard(
                    auction
                );


            if (auction.status === "LIVE") {

                live.appendChild(card);

                liveCount++;

            }

            else if (
                auction.status === "SCHEDULED"
            ) {

                upcoming.appendChild(card);

                upcomingCount++;

            }

            else if (
                auction.status === "SOLD"
            ) {

                sold.appendChild(card);

                soldCount++;

            }

        });


        if (liveCount === 0) {

            live.innerHTML =
                "<div class='empty'>"
                + "No live auctions."
                + "</div>";

        }


        if (upcomingCount === 0) {

            upcoming.innerHTML =
                "<div class='empty'>"
                + "No upcoming auctions."
                + "</div>";

        }


        if (soldCount === 0) {

            sold.innerHTML =
                "<div class='empty'>"
                + "No sold auctions."
                + "</div>";

        }

    }


    function formatDate(dateString) {

        const date =
            new Date(
                dateString.replace(
                    " ",
                    "T"
                )
            );


        if (isNaN(date.getTime())) {

            return dateString;

        }


        return date.toLocaleString(
            "en-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    }


    function startCountdown(
        element,
        endTime
    ) {

        function update() {

            const now =
                new Date();

            const end =
                new Date(
                    endTime.replace(
                        " ",
                        "T"
                    )
                );


            const difference =
                end.getTime()
                - now.getTime();


            if (difference <= 0) {

                element.textContent =
                    "⏱ Auction ended";

                return;

            }


            element.textContent =
                "⏱ "
                + formatDuration(
                    difference
                );

        }


        update();

        setInterval(
            update,
            1000
        );

    }


    function startUpcomingCountdown(
        element,
        startTime
    ) {

        function update() {

            const now =
                new Date();

            const start =
                new Date(
                    startTime.replace(
                        " ",
                        "T"
                    )
                );


            const difference =
                start.getTime()
                - now.getTime();


            if (difference <= 0) {

                element.textContent =
                    "⏱ Auction starting...";

                return;

            }


            element.textContent =
                "⏱ Starts in "
                + formatDuration(
                    difference
                );

        }


        update();

        setInterval(
            update,
            1000
        );

    }


    function formatDuration(
        milliseconds
    ) {

        let seconds =
            Math.floor(
                milliseconds / 1000
            );


        const days =
            Math.floor(
                seconds / 86400
            );

        seconds %= 86400;


        const hours =
            Math.floor(
                seconds / 3600
            );

        seconds %= 3600;


        const minutes =
            Math.floor(
                seconds / 60
            );

        seconds %= 60;


        return (
            (days > 0
                ? days + "d "
                : "")
            + String(hours)
                .padStart(2, "0")
            + ":"
            + String(minutes)
                .padStart(2, "0")
            + ":"
            + String(seconds)
                .padStart(2, "0")
        );

    }


    loadUserSession();

    loadAuctions();

</script>

</body>

</html>
