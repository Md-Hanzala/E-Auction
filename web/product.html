<!DOCTYPE html>
<html>
<head>
    <title>Product Submission - E-Auction</title>
</head>

<body>

    <h1>Seller Product Submission</h1>

    <form method="post" action="product" enctype="multipart/form-data">

        <table>

            <tr>
                <td>Product Name</td>
                <td>
                    <input type="text" name="name" required>
                </td>
            </tr>

            <tr>
                <td>Description</td>
                <td>
                    <textarea name="description" rows="5" cols="30" required></textarea>
                </td>
            </tr>

            <tr>
                <td>Product Image</td>
                <td>
                    <input type="file"
                           name="product_image"
                           accept="image/*"
                           required>
                </td>
            </tr>

            <tr>
                <td>Starting Price</td>
                <td>
                    <input type="number"
                           name="start_price"
                           step="0.01"
                           min="0"
                           required>
                </td>
            </tr>

            <tr>
                <td>Floor Price</td>
                <td>
                    <input type="number"
                           name="floor_price"
                           step="0.01"
                           min="0">
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="SUBMIT PRODUCT">
                </td>

                <td>
                    <input type="reset" value="RESET">
                </td>
            </tr>

        </table>

    </form>

    <p>
        <a href="index.html">Go to Home Page</a>
    </p>

</body>
</html>
