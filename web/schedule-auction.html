<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Schedule Auction - E-Auction</title>

</head>

<body>

    <h1>Schedule Auction</h1>


    <form method="post" action="schedule-auction">

        <table>

            <tr>

                <td>Product ID</td>

                <td>

                    <input
                        type="number"
                        id="productId"
                        name="product_id"
                        required
                    >

                </td>

            </tr>


            <tr>

                <td>Start Time</td>

                <td>

                    <input
                        type="datetime-local"
                        name="start_time"
                        required
                    >

                </td>

            </tr>


            <tr>

                <td>End Time</td>

                <td>

                    <input
                        type="datetime-local"
                        name="end_time"
                        required
                    >

                </td>

            </tr>


            <tr>

                <td>Scheduling Mode</td>

                <td>

                    <select
                        name="scheduling_mode"
                        required
                    >

                        <option value="QUEUE">
                            QUEUE
                        </option>

                        <option value="PARALLEL">
                            PARALLEL
                        </option>

                    </select>

                </td>

            </tr>


            <tr>

                <td>

                    <input
                        type="submit"
                        value="SCHEDULE AUCTION"
                    >

                </td>

                <td>

                    <input
                        type="reset"
                        value="RESET"
                    >

                </td>

            </tr>

        </table>

    </form>


    <p>

        <a href="index.html">
            Go to Home Page
        </a>

    </p>


    <script>

        function loadProductId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const productId =
                params.get("product_id");


            if (productId) {

                document.getElementById(
                    "productId"
                ).value =
                    productId;

                document.getElementById(
                    "productId"
                ).readOnly =
                    true;

            }

        }


        loadProductId();

    </script>


</body>

</html>
